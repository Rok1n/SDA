name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows NSIS installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/core

      - name: Install wasm-bindgen-cli (must match Cargo.lock)
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build WASM decoder core (pkg-web)
        run: pnpm core:build

      - name: Build web + package Electron (NSIS)
        # 上传由 softprops/action-gh-release 完成；禁止 electron-builder 自行发布，
        # 否则 tag 构建会因找不到 repository 配置而失败。
        run: |
          pnpm --filter @sda/web build
          pnpm --filter @sda/desktop exec electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: apps/desktop/dist/*.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
